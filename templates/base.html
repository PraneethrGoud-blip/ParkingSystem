<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
}

.navbar-custom{
    background:grey;
    padding:5px 15px;
}
.navbar-custom .navbar-brand,
.navbar-custom span{
    color:whitesmoke;
    font-size:13px;
}

.sidebar{
    background:black;
    min-height:100vh;
}
.sidebar a{
    display:block;
    color: whitesmoke;
    padding:10px 15px;
    font-size:13px;
    text-decoration:none;
}
.sidebar a:hover,
.sidebar .active{
    background:grey;
    color:white;
}

.box{
    background:white;
    border:1px solid #eee;
    padding:15px;
    margin-bottom:15px;
}

.box-title{
    font-size:14px;
    margin-bottom:10px;
    color:gray;
}

.table td, 
.table th{
    font-size:12px;
    white-space:nowrap;
}

.btn-xs{
    padding:2px 6px;
    font-size:10px;
}

.table td,
.table th{
    vertical-align: middle !important;
    text-align: center;
}

.table{
    width:100%;
}

.table-responsive{
    overflow-x:auto;
}
.badge-leaved{
    background:red;
    color:white;
    padding:5px 12px;
    border-radius:20px;
}
.badge-parked{
    background:green;
    color:white;
    padding:5px 12px;
    border-radius:20px;
}

.badge-green{
    background:green;
    color:white;
    padding:3px 8px;
    border-radius:5px;
}

.badge-blue{
    background:blue;
    color:white;
    padding:5px 10px;
    border-radius:15px;
}

.stat-box{
    color:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:5px;
    text-align:center;
}

.stat-box h3{
    margin:0;
    font-size:24px;
}
.stat-box p{
    margin:5px 0 0;
    font-size:13px;
}

.bg1{background:goldenrod;}
.bg2{background:grey;}
.bg3{background:red;}
.bg4{background:orange;}
.bg5{background:gray;}
.bg6{background:blue;}

</style>
</head>

<body>
<nav class="navbar navbar-custom d-flex align-items-center">
    <button class="btn btn-light btn-sm d-md-none mr-2"
            type="button"
            data-toggle="collapse"
            data-target="#sidebarMenu">
        ☰
    </button>

    <a class="navbar-brand" href="#">PMS Panel</a>

    <span class="ml-auto">Welcome, Administrator</span>
    <a href="{% url 'index' %}" class="btn btn-primary btn-sm ml-2">Logout</a>
</nav>

<div class="container-fluid">
<div class="row">
    <div class="col-12 col-md-3 col-lg-2 p-0">
        <div class="collapse d-md-block sidebar" id="sidebarMenu">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'category' %}">Category</a>
            <a href="{% url 'VehicleEntry' %}">Vehicle Entry</a>
            <a href="{% url 'ManageVehicles' %}">Manage Vehicles</a>
            <a href="{% url 'Reports' %}">Reports</a>
            <a href="{% url 'search' %}">Search</a>
            <a href="{% url 'Account Settings' %}">Account Setting</a>
            <a href="{% url 'index' %}">Logout</a>
        </div>
    </div>
    <div class="col-12 col-md-9 col-lg-10 p-3">
        {% block content %}
        
        {% endblock %}
{% if messages %}

    {% for message in messages %}

        <script>

            alert("{{ message }}")

        </script>

    {% endfor %}

{% endif %}

</div>
</div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

</body>
</html>
