<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Setting</title>

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
}

.navbar-custom{
    background:grey;
    padding:5px 15px;
}
.navbar-custom .navbar-brand,
.navbar-custom span{
    color:whitesmoke;
    font-size:13px;
}

.sidebar{
    background:black;
    min-height:100vh;
}
.sidebar a{
    display:block;
    color: whitesmoke;
    padding:10px 15px;
    font-size:13px;
    text-decoration:none;
}
.sidebar a:hover,
.sidebar .active{
    background:gray;
    color:white;
}

.card{
    margin-top:20px;
}

.btn-round{
    border-radius:30px;
}

.table-responsive{
    overflow-x:auto;
}
</style>
</head>

<body>
<nav class="navbar navbar-custom d-flex align-items-center">
    <button class="btn btn-light btn-sm d-md-none mr-2"
            type="button"
            data-toggle="collapse"
            data-target="#sidebarMenu">
        ☰
    </button>

    <a class="navbar-brand" href="#">PMS Panel</a>

    <span class="ml-auto">Welcome, Administrator</span>
    <a href="{% url 'index' %}" class="btn btn-primary btn-sm ml-2">Logout</a>
</nav>

<div class="container-fluid">
<div class="row">
    <div class="col-12 col-md-3 col-lg-2 p-0">
        <div class="collapse d-md-block sidebar" id="sidebarMenu">
           <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'category' %}">Category</a>
            <a href="{% url 'VehicleEntry' %}">Vehicle Entry</a>
            <a href="{% url 'ManageVehicles' %}">Manage Vehicles</a>
            <a href="{% url 'Reports' %}">Reports</a>
            <a href="{% url 'search' %}">Search</a>
            <a href="{% url 'Account Settings' %}"class="active">Account Setting</a>
            <a href="{% url 'index' %}">Logout</a>
        </div>
    </div>
    <div class="col-12 col-md-9 col-lg-10 p-3">

        <div class="card">
            <div class="card-header">
                ⚙ Change Your Password
            </div>

            <div class="card-body">

                <form>
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Re-enter Password</label>
                        <input type="password" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-round">
                        Change Password
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
